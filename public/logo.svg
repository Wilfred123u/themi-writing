<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="themiGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd7"/>
      <stop offset="25%" stop-color="#f3d483"/>
      <stop offset="60%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#7d5d11"/>
    </linearGradient>
    <radialGradient id="themiHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfb758" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dfb758" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="50" cy="50" r="47" fill="url(#themiHalo)"/>
  
  <!-- Outer Dotted Filigree Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#themiGoldGrad)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Inner Delicate Gold Ring -->
  <circle cx="50" cy="50" r="41.5" stroke="url(#themiGoldGrad)" stroke-width="1.6" opacity="0.9"/>

  <!-- Ornate Cardinal Stars -->
  <path d="M50 3.5 L51.5 7 L50 10.5 L48.5 7 Z" fill="url(#themiGoldGrad)"/>
  <path d="M50 89.5 L51.5 93 L50 96.5 L48.5 93 Z" fill="url(#themiGoldGrad)"/>
  <path d="M3.5 50 L7 51.5 L10.5 50 L7 48.5 Z" fill="url(#themiGoldGrad)"/>
  <path d="M89.5 50 L93 51.5 L96.5 50 L93 48.5 Z" fill="url(#themiGoldGrad)"/>

  <!-- Graceful Arching Golden Feather Quill -->
  <!-- Quill shaft -->
  <path d="M78 18 C63 35, 43 57, 28 82" stroke="url(#themiGoldGrad)" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Feather Vanes (Soft lyrical curves capturing poetry in motion) -->
  <path d="M78 18 C75 26, 68 33, 58 37 C54 38, 48 36, 52 31 C58 24, 68 20, 78 18 Z" fill="url(#themiGoldGrad)" opacity="0.98"/>
  <path d="M68 31 C60 41, 48 49, 36 55 C33 56, 28 53, 33 48 C40 42, 54 35, 68 31 Z" fill="url(#themiGoldGrad)" opacity="0.92"/>
  <path d="M56 45 C48 55, 38 63, 28 71 C26 72, 22 69, 26 65 C32 59, 44 51, 56 45 Z" fill="url(#themiGoldGrad)" opacity="0.86"/>
  
  <!-- Left Plumage -->
  <path d="M75 20 C64 25, 56 33, 52 41 C51 43, 54 44, 57 42 C64 35, 70 28, 75 20 Z" fill="url(#themiGoldGrad)" opacity="0.85"/>
  <path d="M62 37 C52 45, 44 53, 40 61 C39 63, 42 64, 45 62 C52 55, 58 47, 62 37 Z" fill="url(#themiGoldGrad)" opacity="0.8"/>

  <!-- Golden Inkwell Droplet -->
  <path d="M26 84 C26 84, 23 88, 25 91 C27 94, 32 93, 33 89 C34 86, 29 84, 26 84 Z" fill="url(#themiGoldGrad)"/>
  
  <!-- Calligraphic Lyrical Swirl Flourish -->
  <path d="M25 91 C31 92.5, 43 90.5, 49 84.5 C53 80.5, 50 76, 45 78.5 C40 81, 36 86, 29 88" stroke="url(#themiGoldGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
</svg>
